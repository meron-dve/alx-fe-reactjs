<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Key Dashboard</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7385; --accent:#4f46e5; --border:#dde1ec; --err:#c62828; --ok:#1b7f4b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#10131c; --card:#181c28; --text:#e8eaf2; --muted:#98a0b5; --border:#2a3042; --accent:#7c7bff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    main { min-height:100vh; padding:32px 16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; }
    h1 { margin:0; font-size:1.6rem; text-align:center; }
    .card { width:100%; max-width:400px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
    h2 { margin:0 0 16px; font-size:1.1rem; }
    label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:12px; }
    input { display:block; width:100%; margin-top:6px; padding:10px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text); font-size:1rem; }
    input:focus { outline:2px solid var(--accent); }
    button { width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #msg { margin-top:12px; font-size:.9rem; }
    .err { color:var(--err); }
    .key { margin-top:12px; padding:12px; border:1px dashed var(--ok); border-radius:8px; word-break:break-all; font-family:monospace; color:var(--ok); }
    .key small { display:block; font-family:system-ui; color:var(--muted); margin-top:6px; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:500; }
    td.mono { font-family:monospace; }
  </style>
</head>
<body>
  <main>
    <h1>API Key Dashboard</h1>

    <section class="card">
      <h2>Issue an API key</h2>
      <form id="form">
        <label>Company name<input name="companyName" required autocomplete="organization" /></label>
        <label>Email<input name="email" type="email" required autocomplete="email" /></label>
        <label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password" /></label>
        <button type="submit">Submit</button>
      </form>
      <div id="msg"></div>
    </section>

    
  </main>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');

    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button');
      btn.disabled = true;
      msg.textContent = '';
      const res = await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      const data = await res.json();
      btn.disabled = false;
      if (!res.ok) {
        msg.innerHTML = `<span class="err">${esc(data.error)}</span>`;
        return;
      }
      msg.innerHTML = `<div class="key">${esc(data.apiKey)}<small>Copy this now — it won't be shown again.</small></div>`;
      form.reset();
    });
  </script>
</body>
</html>
